name: BrokerApproval
options:
  bundleIdPrefix: login.boring
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "RLN7FJXE64"
    CODE_SIGN_STYLE: Automatic
targets:
  BrokerApproval:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Broker Approval
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: Approve one reviewed authentication request with your device-protected signing key.
        NSLocalNetworkUsageDescription: Connect to your owner-controlled authentication broker on your local network to pair this device and review approval requests.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: login.boring.approval
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
  BrokerApprovalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BrokerApproval
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  BrokerApproval:
    build:
      targets:
        BrokerApproval: all
    test:
      targets:
        - BrokerApprovalTests
